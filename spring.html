  <!DOCTYPE html>

  <head>

    <style>
      *{margin: 0;padding: 0;box-sizing: border-box;}

      body{ background-color: #f6f3ee; color: #4c4c4c;}

        header{
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0% 5%;
    padding-top: 4%;
    padding-bottom: 7%;
    width: 85%;
    margin: auto;
    position: relative;
  }

        .logo{width: 15%;/* border: 1px solid green;*/ padding: 1%;margin-bottom: 1%; position: absolute; left: 50%; transform: translateX(-50%);}

        nav{ gap: 20px; display: flex; font-weight: bolder; padding: 1%; text-align: center;  align-items: center; font-size: small; margin-left: auto;}

      a{ color: #4c4c4c; text-decoration: none;}

      header ul{ list-style: none; }
      /*--------------------------------------------------------------------------------*/

      .main{
        margin: 5% ;
        width: 80%;
        padding: 3% 0%;
        margin: 0px auto;
      }

      main{
        display: flex;        
        justify-content: space-between;
        width: 100% ;
        height: 100%;
        padding: 5% 1%;
      }
      .sup{
        /*border: 2px solid violet;*/
        display: flex;
        margin: 0 auto;
      }
      .season{
        background-image: url(img/qha.jpg);
        background-repeat: no-repeat;
        background-position: center;
        background-size: contain;
        width: 80vh;
        height: 70vh;
      }

      .wirte{
        margin-top: 20%;
      }

      .box{
        /*border: 2px solid black;*/
        width: 40vh;
        height: 60vh;
      }
      
      h3,h5{
        padding: 0% 5%; 
        /*border: 1px solid black;*/
      }
      .b1{
        background-image: url(img/la.png);
        background-repeat: no-repeat;
        background-size: cover;
      }
      
      .b2{
        background-image: url(img/papier.png);
        background-repeat: no-repeat;
        background-size: cover;
      }
      
      .b3{
        background-image: url(img/coco.png);
        background-repeat: no-repeat;
        background-size: cover;
      }
      
      .b4{
        background-image: url(img/y.png);
        background-repeat: no-repeat;
        background-size: cover;
      }

      .b1,.b2,.b3,.b4{
                      background-repeat: no-repeat;
                      background-position: center;
                      background-size: contain;
                      }

  </style>
  </head>
  <body>
        <header>

          </p>
